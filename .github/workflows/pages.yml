name: Deploy visualization to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static visualization
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 app/pipeline/scripts/system/build_web_app.py

      - name: Verify whole-site visual coverage
        run: python3 app/pipeline/scripts/system/check_visual_coverage.py

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: app/dist

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

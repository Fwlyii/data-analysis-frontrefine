name: Deploy visualization to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node for browser checks
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install browser check dependencies
        run: npm ci --prefix tests --ignore-scripts --no-audit --no-fund

      - name: Install Chromium for current-page checks
        run: npm run browser:install --prefix tests

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static visualization
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/system/build_web_app.py

      - name: Verify whole-site visual coverage
        run: python3 scripts/system/check_visual_coverage.py

      - name: Test current pages in a real browser
        run: python3 tests/run.py

      - name: Verify fresh browser coverage
        run: python3 scripts/system/check_visual_coverage.py --browser-report artifacts/qa/after/smoke.json

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: app/dist

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

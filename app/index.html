<script>
(() => {
  const mode = new URLSearchParams(location.search).get('intro');
  let seen = true, storage = false;
  try { seen = sessionStorage.getItem('lens.intro.seen.v1') === '1'; storage = true; } catch {}
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const play = !reduced && mode !== '0' && (mode === '1' || (storage && !seen));
  window.__lensIntroRequest = {mode, play};
  if (play) document.documentElement.classList.add('intro-pending');
  window.__lensIntroBootTimer = setTimeout(() => {
    if (!window.LensIntro) document.documentElement.classList.remove('intro-pending');
  }, 1800);
})();
</script>

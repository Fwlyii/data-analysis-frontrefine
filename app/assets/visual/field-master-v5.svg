<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f33"/>
      <stop offset=".46" stop-color="#102b42"/>
      <stop offset="1" stop-color="#0e2a45"/>
    </linearGradient>
    <radialGradient id="light" cx="76%" cy="24%" r="72%">
      <stop offset="0" stop-color="#49758b" stop-opacity=".38"/>
      <stop offset=".5" stop-color="#1b4358" stop-opacity=".12"/>
      <stop offset="1" stop-color="#0b1f33" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="earth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#365369" stop-opacity=".52"/>
      <stop offset="1" stop-color="#122c40" stop-opacity=".82"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a7c4d6" stop-opacity=".42"/>
      <stop offset="1" stop-color="#6d92a8" stop-opacity=".12"/>
    </linearGradient>
    <pattern id="weave" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)">
      <path d="M0 1H7M0 5H7" stroke="#d7e1df" stroke-width=".35" opacity=".1"/>
      <path d="M1 0V7M5 0V7" stroke="#020d16" stroke-width=".45" opacity=".18"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".68" numOctaves="4" seed="23" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .28"/></feComponentTransfer>
    </filter>
    <filter id="mottle" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".012 .026" numOctaves="3" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .13"/></feComponentTransfer>
    </filter>
    <filter id="cloudRough" x="-15%" y="-25%" width="130%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency=".025" numOctaves="2" seed="8" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#sea)"/>

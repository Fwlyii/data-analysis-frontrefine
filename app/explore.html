<!doctype html>
<html lang="zh-CN" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>LENS · 完整图表库</title>
    <link rel="icon" href="assets/lens.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/vendor/tabler.min.css" />
    <link rel="stylesheet" href="styles.css?v=0a86478073fb" />
    <script src="assets/vendor/echarts.min.js"></script>
    <script src="runtime/summary.js?v=68698aa134b8"></script>
    <script src="runtime/code-data.js?v=f8795c17b3b6"></script>
    <script src="runtime/publication.js?v=aa43e5d99294"></script>
  </head>
  <body>
    <a class="skip-link" href="#stage">跳到图表</a>
    <header class="research-topbar">
      <a class="brand" href="#budget"
        ><strong>LENS</strong><span>模型实验研究</span></a
      >
      <nav class="research-nav" aria-label="主导航">
        <button id="overview-mode">输出效率</button
        ><button id="position-mode">资料位置</button
        ><button id="code-mode">代码生成</button
        ><button id="demo-mode">更多发现</button
        ><button id="explore-mode">图表探索</button>
      </nav>
      <a class="story-home" href="index.html">返回研究展页</a>
      <button
        id="fullscreen"
        class="fullscreen-button"
        aria-label="全屏演示"
        title="全屏演示"
      >
        <img
          src="assets/ui/arrows-maximize.svg"
          width="18"
          height="18"
          alt=""
        />
      </button>
    </header>
    <nav
      id="chapter-nav"
      class="chapter-nav"
      aria-label="更多发现"
      hidden
    ></nav>
    <main id="stage" tabindex="-1"><p class="loading">正在打开图表…</p></main>
    <div id="backdrop" class="backdrop" hidden></div>
    <aside
      id="inspector"
      class="inspector"
      role="dialog"
      aria-modal="true"
      aria-labelledby="inspector-title"
      hidden
    >
      <button id="close-inspector" class="close" aria-label="关闭详情">
        ×
      </button>
      <div id="inspector-body"></div>
    </aside>
    <div id="toast" class="lens-toast" role="status" aria-live="polite"></div>
    <script src="runtime/app.js?v=86f4d2fe134d"></script>
  </body>
</html>
